<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Archive · Zernan Vash</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="description" content="Digital art archive, visual studies, 3D explorations, and concept drafts by Zernan Vash Arive.">

  <!-- Google Fonts: JetBrains Mono & Syne -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --surface: #0e0e0e;
      --surface-hover: #141414;
      --border: #222222;
      --border-hover: #ffffff;
      
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.12);
      
      --text: #f0f0f0;
      --text-muted: #888888;
      --text-faint: #444444;

      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Subtle background grain overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
    }

    input {
      font: inherit;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 clamp(16px, 3vw, 40px);
      position: relative;
      z-index: 1;
    }

    /* ═══════════════════════════════════════════════════════════════════
       MINIMAL TOP BAR (Monochrome)
       ═══════════════════════════════════════════════════════════════════ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 5, 5, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 52px;
      display: flex;
      align-items: center;
    }

    .topbar .container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .nav-back {
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .nav-back:hover {
      color: #ffffff;
    }

    .nav-divider {
      color: var(--border);
    }

    .nav-title {
      color: #ffffff;
    }

    .nav-status {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: #ffffff;
      font-size: 11px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
    }

    /* ═══════════════════════════════════════════════════════════════════
       ARCHIVE CONTROLS HEADER (Clean & Minimal)
       ═══════════════════════════════════════════════════════════════════ */
    .archive-header {
      padding: 28px 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .archive-heading {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cursor-block {
      display: inline-block;
      width: 8px;
      height: 14px;
      background-color: #ffffff;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .search-wrapper {
      position: relative;
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 12px;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════════════════
       SCROLLABLE ARCHIVE GRID
       ═══════════════════════════════════════════════════════════════════ */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding-bottom: 80px;
    }

    .archive-card {
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s;
    }

    .archive-card:hover,
    .archive-card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.08);
      outline: none;
    }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000000;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(105%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s;
    }

    .archive-card:hover .card-img {
      transform: scale(1.04);
      filter: grayscale(0%) contrast(100%);
    }

    .card-id-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--border);
      padding: 3px 6px;
      font-size: 10px;
      color: #ffffff;
      letter-spacing: 0.08em;
    }

    .card-info {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11px;
      background: var(--surface);
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .card-label {
      color: var(--text-faint);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-year {
      color: var(--text-faint);
    }

    /* ═══════════════════════════════════════════════════════════════════
       EMPTY STATE
       ═══════════════════════════════════════════════════════════════════ */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      border: 1px dashed var(--border);
      background: var(--surface);
      color: var(--text-muted);
    }

    .empty-btn {
      margin-top: 12px;
      padding: 6px 14px;
      border: 1px solid #ffffff;
      color: #ffffff;
      font-size: 11px;
      transition: all 0.15s;
    }

    .empty-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    /* ═══════════════════════════════════════════════════════════════════
       LIGHTBOX MODAL
       ═══════════════════════════════════════════════════════════════════ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      place-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .lightbox.open {
      display: grid;
      opacity: 1;
    }

    .lightbox-content {
      position: relative;
      max-width: 92vw;
      max-height: 90vh;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .lightbox-top {
      padding: 10px 16px;
      background: #000000;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .lightbox-id {
      color: #ffffff;
    }

    .lightbox-close {
      color: var(--text-muted);
      padding: 2px 6px;
      border: 1px solid var(--border);
      transition: all 0.15s;
    }

    .lightbox-close:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    .lightbox-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      padding: 16px;
      overflow: hidden;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      transition: all 0.15s;
    }

    .lightbox-nav:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    .lightbox-prev { left: 12px; }
    .lightbox-next { right: 12px; }

    .lightbox-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      background: var(--surface);
    }

    .lightbox-title {
      font-weight: 700;
      color: #ffffff;
    }

    .lightbox-meta {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* ═══════════════════════════════════════════════════════════════════
       MINIMAL FOOTER
       ═══════════════════════════════════════════════════════════════════ */
    .footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      font-size: 11px;
      color: var(--text-faint);
    }

    .footer .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-links a:hover {
      color: #ffffff;
    }

    @media (max-width: 640px) {
      .archive-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .card-info {
        padding: 8px 10px;
        font-size: 10px;
      }
      .card-title {
        font-size: 11px;
      }
    }
  </style>
</head>

        { id: "31", file: "notime (2).webp", title: "No Time", year: "2023" },

        { id: "40", file: "room_pridefinal.webp", title: "Room Pride", year: "2024" },
        { id: "41", file: "sample7 (2).webp", title: "Sample Portrait", year: "2023" },
        { id: "42", file: "saturn-raw.webp", title: "Saturn", year: "2023" },
        { id: "43", file: "sayout (2).webp", title: "Say Out", year: "2023" },
        { id: "44", file: "timeCUT (2).webp", title: "Time Cut", year: "2023" },
        { id: "45", file: "walkerr-studio.webp", title: "Walker Studio", year: "2023" },
        { id: "46", file: "week2 final.webp", title: "Composition Week 2", year: "2023" },
        { id: "47", file: "wheredonuts.webp", title: "Where Donuts?", year: "2024" },
        { id: "48", file: "275800320_1659008111104273_5902296955083926867_n (2).webp", title: "Reverie", year: "2023" }
      ];

      const grid = document.getElementById("archive-grid");
      const searchInput = document.getElementById("search-input");
      const headerCount = document.getElementById("header-count");

      const lightbox = document.getElementById("lightbox");
      const lightboxClose = document.getElementById("lightbox-close");
      const lightboxImg = document.getElementById("lightbox-img");
      const lightboxId = document.getElementById("lightbox-id");
      const lightboxTitle = document.getElementById("lightbox-title");
      const lightboxMeta = document.getElementById("lightbox-meta");
      const lightboxPrev = document.getElementById("lightbox-prev");
      const lightboxNext = document.getElementById("lightbox-next");

      let currentFiltered = [...artworks];
      let currentIndex = 0;

      if (headerCount) headerCount.textContent = artworks.length;

      function renderGrid(items) {
        if (!grid) return;
        grid.innerHTML = "";

        if (items.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div>NO ENTRIES FOUND</div>
              <button class="empty-btn" id="reset-btn">RESET SEARCH</button>
            </div>
          `;
          const rBtn = grid.querySelector("#reset-btn");
          if (rBtn) {
            rBtn.addEventListener("click", () => {
              if (searchInput) searchInput.value = "";
              applyFilter();
            });
          }
          return;
        }

        items.forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "archive-card";
          card.setAttribute("tabindex", "0");
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `View ${item.title}`);

          card.innerHTML = `
            <div class="card-media">
              <img class="card-img" src="../src/${item.file}" alt="${item.title}" loading="lazy">
              <div class="card-id-tag">ID_${item.id}</div>
            </div>
            <div class="card-info">
              <div class="card-row">
                <span class="card-label">TITLE:</span>
                <span class="card-title">${item.title}</span>
              </div>
              <div class="card-row">
                <span class="card-label">DATE:</span>
                <span class="card-year">${item.year}</span>
              </div>
            </div>
          `;

          const openSelf = () => openLightbox(index);
          card.addEventListener("click", openSelf);
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openSelf();
            }
          });

          grid.appendChild(card);
        });
      }

      function applyFilter() {
        const query = searchInput ? searchInput.value.trim().toLowerCase() : "";
        currentFiltered = artworks.filter(item => {
          return !query || 
            item.title.toLowerCase().includes(query) ||
            item.file.toLowerCase().includes(query) ||
            item.year.includes(query);
        });

        renderGrid(currentFiltered);
      }

      if (searchInput) {
        searchInput.addEventListener("input", applyFilter);
      }

      function openLightbox(index) {
        if (!currentFiltered[index]) return;
        currentIndex = index;
        const item = currentFiltered[index];

        lightboxImg.src = `../src/${item.file}`;
        lightboxImg.alt = item.title;
        lightboxId.textContent = `ID_${item.id}`;
        lightboxTitle.textContent = item.title;
        lightboxMeta.textContent = item.year;

        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
        if (lightboxClose) lightboxClose.focus();
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightboxImg.src = "";
        document.body.style.overflow = "";
      }

      if (lightboxClose) lightboxClose.addEventListener("click", closeLightbox);
      if (lightbox) {
        lightbox.addEventListener("click", (e) => {
          if (e.target === lightbox) closeLightbox();
        });
      }

      if (lightboxPrev) {
        lightboxPrev.addEventListener("click", () => {
          if (currentFiltered.length === 0) return;
          currentIndex = (currentIndex - 1 + currentFiltered.length) % currentFiltered.length;
          openLightbox(currentIndex);
        });
      }

      if (lightboxNext) {
        lightboxNext.addEventListener("click", () => {
          if (currentFiltered.length === 0) return;
          currentIndex = (currentIndex + 1) % currentFiltered.length;
          openLightbox(currentIndex);
        });
      }

      window.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") {
          currentIndex = (currentIndex - 1 + currentFiltered.length) % currentFiltered.length;
          openLightbox(currentIndex);
        }
        if (e.key === "ArrowRight") {
          currentIndex = (currentIndex + 1) % currentFiltered.length;
          openLightbox(currentIndex);
        }
      });

      const yLabel = document.getElementById("year-label");
      if (yLabel) yLabel.textContent = new Date().getFullYear();

      applyFilter();
    })();
  </script>
</body>
</html>
